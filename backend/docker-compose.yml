version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medical_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medical_analysis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: medical_ai_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/medical_analysis_db
      SECRET_KEY: super-secret-medical-ai-jwt-key-2026
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
